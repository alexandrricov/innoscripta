# Serving one built app.
#
# Three containers run this same file; what differs is the bundle copied in next
# to it.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The shell and each standalone remote are single-page apps: any path that is
  # not a file is still the app.
  location / {
    try_files $uri $uri/ /index.html;

    # A remote's assets are fetched by a page served from the shell's origin -
    # its `remoteEntry.js`, its chunks, and the seed fixture it emits as an
    # asset. Scripts would load cross-origin without this, but `fetch` would
    # not, so the first run of a hosted remote would fail to seed itself.
    #
    # Wide open on purpose: everything served here is a public static bundle,
    # and the deployment topology - who may host whom - is not something a
    # static file server can decide. A real deployment narrows this to the known
    # shell origins.
    add_header Access-Control-Allow-Origin '*' always;
  }

  # Never cached: the entry document and the generated configuration are how a
  # new deployment and a new set of remote URLs reach the browser at all.
  location = /index.html {
    add_header Cache-Control 'no-store' always;
    add_header Access-Control-Allow-Origin '*' always;
  }

  location = /config.js {
    add_header Cache-Control 'no-store' always;
    add_header Access-Control-Allow-Origin '*' always;
  }

  # `remoteEntry.js` is a manifest, not a hashed chunk: its name is stable and
  # its content changes with every deploy of that remote. Caching it would pin a
  # host to a remote's previous build.
  location = /remoteEntry.js {
    add_header Cache-Control 'no-store' always;
    add_header Access-Control-Allow-Origin '*' always;
  }

  # Everything else the bundler emits carries a content hash in its name.
  location ~* \.(js|css|woff2?|png|svg|json)$ {
    expires 1y;
    add_header Cache-Control 'public, immutable' always;
    add_header Access-Control-Allow-Origin '*' always;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
